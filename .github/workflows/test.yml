name: Test

# This workflow runs unit tests on pull requests and the online E2E suite
# against a local captured fixture server.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "FlowDown/**"
      - "Frameworks/**"
      - "FlowDownUnitTests/**"
      - "Resources/**"
      - "FlowDown.xcodeproj/**"
      - "FlowDown.xcworkspace/**"
      - ".github/workflows/test.yml"
      - "Makefile"
      - "Package.resolved"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'housekeeping/') }}
    name: Unit Tests
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Newest Xcode
        run: |
          chmod +x Resources/DevKit/scripts/select_newest_xcode.sh
          ./Resources/DevKit/scripts/select_newest_xcode.sh

      - name: Install Metal Toolchain
        run: make install-metal-toolchain

      - name: Resolve Packages
        run: make package-resolve

      - name: Run Unit Tests
        run: make test-unit

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  online-e2e:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'housekeeping/') }}
    name: Online E2E
    needs: test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Newest Xcode
        run: |
          chmod +x Resources/DevKit/scripts/select_newest_xcode.sh
          ./Resources/DevKit/scripts/select_newest_xcode.sh

      - name: Install Metal Toolchain
        run: make install-metal-toolchain

      - name: Resolve Packages
        run: make package-resolve

      - name: Run Online E2E
        run: make test-online-e2e

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-e2e-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7
